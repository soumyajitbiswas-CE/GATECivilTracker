  <circle cx="512" cy="492" r="57" fill="url(#green)" stroke="#E8FFD2" stroke-width="6"/>
  <path d="M512 452C532 470 548 478 570 492C548 506 532 514 512 532C492 514 476 506 454 492C476 478 492 470 512 452Z"
