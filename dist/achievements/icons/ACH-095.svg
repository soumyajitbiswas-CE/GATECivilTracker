  <circle cx="512" cy="492" r="124" stroke="#CFFFAD" stroke-width="5" stroke-dasharray="5 17"/>
  <circle cx="512" cy="492" r="160" stroke="#2AD75A" stroke-width="4" stroke-dasharray="18 14"/>
</g>

<!-- flow direction accents -->
