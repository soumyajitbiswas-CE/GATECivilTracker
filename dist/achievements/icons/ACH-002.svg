<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="g" x1="300" y1="220" x2="720" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D8FFAE"/><stop offset=".25" stop-color="#7CFF4D"/><stop offset=".62" stop-color="#22D85A"/><stop offset="1" stop-color="#067A35"/>
  </linearGradient>
  <linearGradient id="metal" x1="270" y1="240" x2="750" y2="740" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A8FF91"/><stop offset=".35" stop-color="#26E85D"/><stop offset=".7" stop-color="#087B38"/><stop offset="1" stop-color="#43FF75"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".75"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".075" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".16"/>
  </pattern>
</defs>

<!-- restrained outer energy -->
<g filter="url(#glow)" opacity=".75">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".45"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark technical medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>

<!-- blueprint construction field -->
<circle cx="512" cy="492" r="286" fill="url(#grid)" opacity=".9"/>
<g stroke="#67FF83" stroke-opacity=".15" stroke-width="2">
  <path d="M512 210V774"/><path d="M230 492H794"/>
  <path d="M312 292L712 692"/><path d="M712 292L312 692"/>
</g>

<!-- Blueprint sheet -->
<g filter="url(#shadow)">
  <path d="M284 300L704 300L752 348V676L704 724H284L236 676V348Z"
        fill="#071A0E" stroke="#3DFF70" stroke-width="8"/>
  <path d="M704 300V348H752" stroke="#A4FF8D" stroke-width="5"/>
  <path d="M278 350H708M278 390H708M278 634H708M278 674H708"
        stroke="#32D95F" stroke-opacity=".25" stroke-width="3"/>
  <path d="M330 410V610M386 410V610M442 410V610M498 410V610M554 410V610M610 410V610M666 410V610"
        stroke="#32D95F" stroke-opacity=".18" stroke-width="3"/>
</g>

<!-- central completed blueprint seal: no checkmark -->
<g filter="url(#tight)">
  <circle cx="512" cy="510" r="128" fill="#06150B" stroke="#7BFF78" stroke-width="9"/>
  <circle cx="512" cy="510" r="105" stroke="#24D75A" stroke-width="4" stroke-dasharray="8 13"/>
  <circle cx="512" cy="510" r="77" fill="#0A321A" stroke="#C5FFAA" stroke-width="5"/>
  <!-- completion star/rosette -->
  <path d="M512 448L532 486L574 491L543 520L551 562L512 542L473 562L481 520L450 491L492 486Z"
        fill="url(#g)" stroke="#D8FFB8" stroke-width="4"/>
  <circle cx="512" cy="510" r="18" fill="#DFFFC7"/>
</g>

<!-- technical dimension marks -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".7">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- small blueprint nodes -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="326" cy="370" r="5"/><circle cx="698" cy="370" r="5"/>
  <circle cx="326" cy="614" r="5"/><circle cx="698" cy="614" r="5"/>
</g>

<!-- lower completion beam -->
<g filter="url(#tight)">
  <path d="M350 754H674" stroke="#0A6B34" stroke-width="18" stroke-linecap="round"/>
  <path d="M350 754H674" stroke="#58FF78" stroke-width="5" stroke-linecap="round"/>
  <circle cx="512" cy="754" r="11" fill="#D4FFB2"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#g)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- four micro orbit markers -->
<g fill="#76FF88">
  <circle cx="245" cy="492" r="5"/><circle cx="779" cy="492" r="5"/>
  <circle cx="512" cy="220" r="5"/><circle cx="512" cy="764" r="5"/>
</g>
</svg>