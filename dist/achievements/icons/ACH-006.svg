<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="300" y1="220" x2="730" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <linearGradient id="metal" x1="300" y1="300" x2="700" y2="690" gradientUnits="userSpaceOnUse">
    <stop stop-color="#AFFF9A"/><stop offset=".35" stop-color="#36EB69"/><stop offset=".72" stop-color="#087B38"/><stop offset="1" stop-color="#4AFF78"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".8"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- restrained outer aura -->
<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark technical medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>

<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- equipment rack -->
<g filter="url(#shadow)">
  <rect x="278" y="270" width="468" height="448" rx="32" fill="#06150B" stroke="#3DFF70" stroke-width="9"/>
  <rect x="305" y="302" width="414" height="382" rx="20" fill="#081D10" stroke="#0F8B40" stroke-width="4"/>
</g>

<!-- top equipment rail -->
<g filter="url(#tight)">
  <path d="M328 342H696" stroke="#6EFF80" stroke-width="7" stroke-linecap="round"/>
  <circle cx="352" cy="342" r="12" fill="#BFFF9E"/>
  <circle cx="672" cy="342" r="12" fill="#BFFF9E"/>
  <path d="M382 318V365M430 318V365M478 318V365M546 318V365M594 318V365M642 318V365"
        stroke="#35E964" stroke-opacity=".42" stroke-width="4"/>
</g>

<!-- three prepared loadout modules -->
<g filter="url(#tight)">
  <!-- left module: book / knowledge -->
  <rect x="340" y="395" width="92" height="164" rx="16" fill="#0A321A" stroke="#4CFF72" stroke-width="6"/>
  <path d="M360 430C378 420 396 420 412 430V526C395 517 378 517 360 526Z"
        fill="#123C20" stroke="#9EFF87" stroke-width="4"/>
  <path d="M386 430V526" stroke="#BFFF9F" stroke-width="3"/>
  <path d="M368 455H379M368 477H379M394 455H405M394 477H405"
        stroke="#54FF76" stroke-width="4" stroke-linecap="round"/>

  <!-- center module: power core -->
  <rect x="466" y="385" width="92" height="184" rx="18" fill="#092C17" stroke="#76FF80" stroke-width="7"/>
  <circle cx="512" cy="477" r="54" fill="#06150B" stroke="#B8FF99" stroke-width="5"/>
  <circle cx="512" cy="477" r="37" fill="#0B4924" stroke="#39F269" stroke-width="5"/>
  <path d="M512 438L535 476L512 516L489 476Z" fill="url(#green)" stroke="#D9FFB7" stroke-width="4"/>
  <circle cx="512" cy="477" r="9" fill="#E7FFD0" filter="url(#tight)"/>

  <!-- right module: planner / target -->
  <rect x="592" y="395" width="92" height="164" rx="16" fill="#0A321A" stroke="#4CFF72" stroke-width="6"/>
  <circle cx="638" cy="475" r="37" fill="#06150B" stroke="#8DFF7E" stroke-width="4"/>
  <circle cx="638" cy="475" r="22" stroke="#43F46E" stroke-width="4"/>
  <circle cx="638" cy="475" r="7" fill="#CFFFAC"/>
  <path d="M638 428V441M638 509V522M591 475H604M672 475H685"
        stroke="#5BFF78" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- lower readiness tray -->
<g filter="url(#tight)">
  <path d="M344 603H680L650 646H374Z" fill="#0B3219" stroke="#58FF78" stroke-width="6"/>
  <path d="M386 620H638" stroke="#A9FF8C" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 620V637M470 620V637M520 620V637M570 620V637M620 620V637"
        stroke="#31DE5E" stroke-width="4"/>
</g>

<!-- locking rings around prepared loadout -->
<g filter="url(#glow)" opacity=".75">
  <circle cx="512" cy="490" r="236" stroke="#35F269" stroke-width="5" stroke-dasharray="12 17"/>
  <circle cx="512" cy="490" r="258" stroke="#118E42" stroke-width="3" stroke-dasharray="3 21"/>
</g>

<!-- small energy connectors -->
<g stroke="#7CFF87" stroke-width="6" stroke-linecap="round" opacity=".72">
  <path d="M432 477H466"/><path d="M558 477H592"/>
  <path d="M512 569V603"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corner markers -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- subtle particles -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="303" cy="410" r="4"/><circle cx="721" cy="410" r="4"/>
  <circle cx="322" cy="604" r="3"/><circle cx="702" cy="604" r="4"/>
  <circle cx="408" cy="755" r="4"/><circle cx="620" cy="755" r="3"/>
</g>
</svg>