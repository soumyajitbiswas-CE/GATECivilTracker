<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="330" y1="220" x2="700" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".58" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <linearGradient id="ring" x1="300" y1="300" x2="720" y2="700" gradientUnits="userSpaceOnUse">
    <stop stop-color="#B8FF98"/><stop offset=".45" stop-color="#3FFF6F"/><stop offset="1" stop-color="#087B38"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".78"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- outer technical aura -->
<g filter="url(#glow)" opacity=".75">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>

<!-- technical field -->
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>
<g stroke="#67FF83" stroke-opacity=".12" stroke-width="2">
  <path d="M512 210V774"/><path d="M230 492H794"/>
  <path d="M312 292L712 692"/><path d="M712 292L312 692"/>
</g>

<!-- seven-day orbital track -->
<g filter="url(#glow)">
  <circle cx="512" cy="492" r="225" stroke="#0B5B2D" stroke-width="26" opacity=".65"/>
  <circle cx="512" cy="492" r="225" stroke="url(#ring)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="170 30 170 30 170 30 170 30 170 30 170 30 170 30"/>
</g>

<!-- central momentum core -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="112" fill="#06150B" stroke="#4CFF72" stroke-width="8"/>
  <circle cx="512" cy="492" r="88" fill="#0A321A" stroke="#8CFF7C" stroke-width="4"/>
</g>

<!-- seven orbiting day nodes -->
<g filter="url(#tight)">
  <circle cx="512" cy="267" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="688" cy="350" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="727" cy="530" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="620" cy="694" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="404" cy="694" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="297" cy="530" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
  <circle cx="336" cy="350" r="24" fill="url(#green)" stroke="#D4FFB0" stroke-width="5"/>
</g>

<!-- seven internal connection beams -->
<g stroke="#3CFF6C" stroke-width="6" stroke-linecap="round" opacity=".65">
  <path d="M512 267L688 350"/>
  <path d="M688 350L727 530"/>
  <path d="M727 530L620 694"/>
  <path d="M620 694L404 694"/>
  <path d="M404 694L297 530"/>
  <path d="M297 530L336 350"/>
  <path d="M336 350L512 267"/>
</g>

<!-- continuous flame / forward motion in the center -->
<g filter="url(#tight)">
  <path d="M512 571
           C466 544 450 507 476 468
           C489 449 505 432 512 402
           C543 438 572 470 560 509
           C551 538 533 556 512 571Z"
        fill="url(#green)" stroke="#C8FFAA" stroke-width="5"/>
  <path d="M512 544
           C495 526 493 505 507 487
           C514 477 520 465 522 452
           C540 478 546 498 538 518
           C532 532 523 540 512 544Z"
        fill="#E2FFC8" fill-opacity=".72"/>
</g>

<!-- directional arc: the streak keeps moving -->
<g filter="url(#tight)" stroke="#8BFF84" stroke-linecap="round">
  <path d="M380 430C350 500 360 570 405 624" stroke-width="10"/>
  <path d="M644 430C674 500 664 570 619 624" stroke-width="10"/>
  <path d="M396 424L377 432L386 450" stroke-width="7"/>
  <path d="M628 424L647 432L638 450" stroke-width="7"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corner markers -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- small energy particles -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="365" cy="275" r="4"/><circle cx="660" cy="285" r="5"/>
  <circle cx="270" cy="610" r="4"/><circle cx="751" cy="614" r="4"/>
  <circle cx="430" cy="755" r="4"/><circle cx="592" cy="755" r="3"/>
</g>
</svg>