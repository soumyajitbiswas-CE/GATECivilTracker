<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="320" y1="190" x2="700" y2="780" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".8"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- outer technical aura -->
<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>

<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- three-dimensional revision loop -->
<g filter="url(#shadow)">
  <path d="M512 284
           C626 284 704 365 704 474
           C704 585 620 668 512 668
           C403 668 320 590 320 486"
        fill="none" stroke="#0A572B" stroke-width="55" stroke-linecap="round"/>
  <path d="M512 284
           C626 284 704 365 704 474
           C704 585 620 668 512 668
           C403 668 320 590 320 486"
        fill="none" stroke="#42F26D" stroke-width="12" stroke-linecap="round"/>
</g>

<!-- second orbit, offset to make the loop feel iterative -->
<g filter="url(#tight)">
  <path d="M512 328
           C592 328 655 387 655 474
           C655 558 593 620 512 620
           C429 620 369 564 369 484"
        fill="none" stroke="#8BFF7B" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 15"/>
</g>

<!-- turning arrows / cycle momentum -->
<g filter="url(#tight)">
  <path d="M300 486L320 438L362 470" fill="#63FF7A" stroke="#D2FFB0" stroke-width="4" stroke-linejoin="round"/>
  <path d="M724 474L704 522L662 490" fill="#63FF7A" stroke="#D2FFB0" stroke-width="4" stroke-linejoin="round"/>
</g>

<!-- central knowledge core being refined -->
<g filter="url(#shadow)">
  <circle cx="512" cy="474" r="112" fill="#06150B" stroke="#55FF78" stroke-width="8"/>
  <circle cx="512" cy="474" r="84" fill="#0A321A" stroke="#A5FF8A" stroke-width="5"/>
</g>

<!-- layered book / knowledge block -->
<g filter="url(#tight)">
  <path d="M458 438C478 427 496 430 512 440C528 430 546 427 566 438V530C546 519 528 521 512 532C496 521 478 519 458 530Z"
        fill="#123B20" stroke="#C8FFAA" stroke-width="5"/>
  <path d="M512 440V532" stroke="#7DFF82" stroke-width="5"/>
  <path d="M470 458H496M470 480H496M528 458H554M528 480H554"
        stroke="#43F16C" stroke-width="5" stroke-linecap="round"/>
  <!-- refined layer -->
  <path d="M480 506H544" stroke="#A7FF8B" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- iteration sparks around the loop -->
<g filter="url(#tight)">
  <circle cx="382" cy="337" r="9" fill="#D8FFB8"/>
  <circle cx="638" cy="345" r="8" fill="#A8FF91"/>
  <circle cx="714" cy="566" r="8" fill="#79FF7E"/>
  <circle cx="390" cy="638" r="8" fill="#4CFF72"/>
</g>

<!-- small refinement bars -->
<g stroke="#78FF88" stroke-linecap="round" opacity=".72">
  <path d="M390 704H455" stroke-width="6"/>
  <path d="M474 704H512" stroke-width="6"/>
  <path d="M531 704H596" stroke-width="6"/>
  <path d="M390 280H455" stroke-width="6"/>
  <path d="M474 280H512" stroke-width="6"/>
  <path d="M531 280H596" stroke-width="6"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corner markers -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- subtle particles -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="303" cy="414" r="4"/><circle cx="721" cy="414" r="4"/>
  <circle cx="324" cy="608" r="3"/><circle cx="700" cy="608" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>