  <path d="M512 558L590 602L590 642L512 686L434 642V602Z"
        fill="#0A321A" stroke="#65FF7A" stroke-width="7"/>
  <path d="M416 502L474 536V580L416 614L358 580V536Z"
        fill="#0A321A" stroke="#65FF7A" stroke-width="7"/>
  <path d="M416 390L474 424V468L416 502L358 468V424Z"
        fill="#0A321A" stroke="#82FF83" stroke-width="7"/>
  <path d="M512 446L550 468V512L512 534L474 512V468Z"
        fill="#0A321A" stroke="#AFFF92" stroke-width="7"/>
</g>

<!-- chain connections -->
<g fill="none" stroke-linecap="round" filter="url(#tight)">
  <path d="M512 334V274" stroke="#8FFF80" stroke-width="7"/>
  <path d="M666 446L718 476" stroke="#6EFF7F" stroke-width="7"/>
  <path d="M666 558L718 528" stroke="#55FF78" stroke-width="7"/>
  <path d="M512 686V746" stroke="#45EF6D" stroke-width="7"/>
  <path d="M358 558L306 528" stroke="#45EF6D" stroke-width="7"/>
  <path d="M358 446L306 476" stroke="#6EFF7F" stroke-width="7"/>
</g>

<!-- central streak core -->
<g filter="url(#shadow)">
  <circle cx="512" cy="490" r="94" fill="#06150B" stroke="#72FF80" stroke-width="9"/>
  <circle cx="512" cy="490" r="62" fill="#0A351B" stroke="#C9FFAA" stroke-width="5"/>
  <path d="M512 430L532 470L568 490L532 510L512 550L492 510L456 490L492 470Z"
        fill="url(#green)" stroke="#E2FFC8" stroke-width="4"/>
  <circle cx="512" cy="490" r="12" fill="#F0FFD9"/>
</g>

<!-- unbroken signal line -->
<g filter="url(#tight)" stroke-linecap="round">
  <path d="M306 490H390" stroke="#7DFF88" stroke-width="7"/>
  <path d="M634 490H718" stroke="#7DFF88" stroke-width="7"/>
  <path d="M512 274V358" stroke="#AFFF92" stroke-width="7"/>
  <path d="M512 622V706" stroke="#55FF78" stroke-width="7"/>
</g>

<!-- streak sparks -->
<g filter="url(#glow)">
  <circle cx="326" cy="488" r="8" fill="#DFFFBE"/>
  <circle cx="698" cy="488" r="8" fill="#B6FF98"/>
  <circle cx="512" cy="292" r="8" fill="#C9FFAA"/>
  <circle cx="512" cy="724" r="8" fill="#75FF82"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corners -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- subtle particles -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>