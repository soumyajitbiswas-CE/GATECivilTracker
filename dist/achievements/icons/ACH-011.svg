  <circle cx="470" cy="458" r="18" fill="#E4FFC9"/>
  <circle cx="470" cy="458" r="31" stroke="#65FF7A" stroke-width="4" opacity=".6"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

