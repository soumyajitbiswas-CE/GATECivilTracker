  <path d="M372 352H420" stroke="#AFFF91" stroke-width="8" stroke-linecap="round"/>
  <path d="M604 352H652" stroke="#AFFF91" stroke-width="8" stroke-linecap="round"/>
  <path d="M372 610H420" stroke="#55FF77" stroke-width="8" stroke-linecap="round"/>
  <path d="M604 610H652" stroke="#55FF77" stroke-width="8" stroke-linecap="round"/>

  <circle cx="395" cy="410" r="9" fill="#BFFF9F"/>
  <circle cx="629" cy="410" r="9" fill="#BFFF9F"/>
  <circle cx="395" cy="550" r="9" fill="#6EFF7F"/>
  <circle cx="629" cy="550" r="9" fill="#6EFF7F"/>
