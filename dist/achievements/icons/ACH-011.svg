  <path d="M538 526L608 596" stroke="#8DFF7E" stroke-width="20" stroke-linecap="round"/>
  <path d="M538 526L608 596" stroke="#0B6C34" stroke-width="32" stroke-linecap="round"/>
  <path d="M538 526L608 596" stroke="#63FF7A" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- question fragments being hunted / captured -->
