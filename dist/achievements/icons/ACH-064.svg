</g>

<!-- hammer -->
<g filter="url(#shadow)">
  <path d="M574 320L626 372L598 400L546 348Z" fill="#0A351B" stroke="#CFFFAD" stroke-width="8" stroke-linejoin="round"/>
  <path d="M598 344L644 390" stroke="#70FF7F" stroke-width="16" stroke-linecap="round"/>
</g>

<!-- forging sparks -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M442 404L414 370M470 366L458 324M548 366L560 324M582 404L610 370" stroke="#E3FFC8" stroke-width="9"/>
  <path d="M426 450L388 438M598 450L636 438" stroke="#8DFF7E" stroke-width="8"/>
</g>

<!-- heat rings -->
<g fill="none" stroke-linecap="round">
  <circle cx="512" cy="450" r="106" stroke="#55FF78" stroke-width="6" stroke-dasharray="8 16"/>
  <circle cx="512" cy="450" r="148" stroke="#2AD75A" stroke-width="4" stroke-dasharray="20 14"/>
</g>

<!-- forge nodes -->
<g filter="url(#tight)">
  <circle cx="370" cy="360" r="12" fill="#DFFFBE" stroke="#72FF80" stroke-width="5"/>
  <circle cx="654" cy="360" r="12" fill="#BFFF9F" stroke="#55FF78" stroke-width="5"/>
  <circle cx="370" cy="624" r="12" fill="#70FF7F" stroke="#45EF6D" stroke-width="5"/>
  <circle cx="654" cy="624" r="12" fill="#55FF78" stroke="#45EF6D" stroke-width="5"/>
</g>

<!-- vertical forge energy -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M512 210V282" stroke="#0A6B34" stroke-width="32"/>
  <path d="M512 210V282" stroke="#E3FFC8" stroke-width="9"/>
  <path d="M512 700V778" stroke="#0A6B34" stroke-width="32"/>
  <path d="M512 700V778" stroke="#63FF79" stroke-width="9"/>
</g>

<!-- heat exhaust -->
<g fill="none" stroke-linecap="round" filter="url(#tight)">
  <path d="M410 612C438 650 474 670 512 674C550 670 586 650 614 612" stroke="#70FF7F" stroke-width="7"/>
  <path d="M394 344C430 310 470 292 512 290C554 292 594 310 630 344" stroke="#BFFF9F" stroke-width="7"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>