  <path d="M430 574H594L570 622H454Z" fill="#0A351B" stroke="#55FF78" stroke-width="7" stroke-linejoin="round"/>
  <path d="M410 526L438 486H586L614 526Z" fill="#0D3B1D" stroke="#BFFF9F" stroke-width="7" stroke-linejoin="round"/>
</g>

<!-- forged core -->
<g filter="url(#glow)">
  <path d="M512 334L548 390L590 430L548 470L512 536L476 470L434 430L476 390Z"
        fill="url(#green)" stroke="#F0FFD9" stroke-width="8" stroke-linejoin="round"/>
