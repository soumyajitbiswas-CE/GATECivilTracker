<stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
</radialGradient>
<linearGradient id="g" x1="300" y1="790" x2="720" y2="150" gradientUnits="userSpaceOnUse">
