<circle cx="512" cy="470" r="118" stroke="#CFFFAD" stroke-width="6" stroke-dasharray="7 15"/>
<circle cx="512" cy="470" r="164" stroke="#55FF78" stroke-width="5" stroke-dasharray="20 14"/>
<circle cx="512" cy="470" r="204" stroke="#2AD75A" stroke-width="4" stroke-dasharray="6 25"/>
</g>

<!-- anchor nodes -->
<g filter="url(#shadow)">
<path d="M368 348L400 332L428 360L408 394L374 384Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M656 348L624 332L596 360L616 394L650 384Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M368 636L400 652L428 624L408 590L374 600Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
<path d="M656 636L624 652L596 624L616 590L650 600Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
</g>

<!-- energy rails -->
<g filter="url(#glow)" stroke-linecap="round">
<path d="M512 210V280" stroke="#0A6B34" stroke-width="32"/><path d="M512 210V280" stroke="#E3FFC8" stroke-width="9"/>
<path d="M512 706V780" stroke="#0A6B34" stroke-width="32"/><path d="M512 706V780" stroke="#63FF79" stroke-width="9"/>
</g>

