<path d="M614 456H670" stroke="#E3FFC8" stroke-width="9"/>
<path d="M360 526H414" stroke="#70FF7F" stroke-width="8"/>
<path d="M610 526H664" stroke="#70FF7F" stroke-width="8"/>
</g>

