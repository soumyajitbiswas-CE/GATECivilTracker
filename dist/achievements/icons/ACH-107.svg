<path d="M512 590V300" stroke="#0A6B34" stroke-width="34"/>
<path d="M512 590V300" stroke="#CFFFAD" stroke-width="9"/>
<path d="M512 300L478 342M512 300L546 342" stroke="#CFFFAD" stroke-width="9"/>
</g>

<!-- resistance bands -->
<g filter="url(#tight)" stroke-linecap="round">
