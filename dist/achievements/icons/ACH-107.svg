<circle cx="414" cy="326" r="5" fill="#E3FFC8"/><circle cx="610" cy="326" r="5" fill="#CFFFAD"/>
<circle cx="392" cy="662" r="4" fill="#70FF7F"/><circle cx="632" cy="662" r="4" fill="#55FF78"/>
<path d="M512 132L541 170L512 206L483 170Z" fill="url(#g)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
<path d="M270 270H340M270 270V340"/><path d="M754 270H684M754 270V340"/>
<path d="M270 714H340M270 714V644"/><path d="M754 714H684M754 714V644"/>
