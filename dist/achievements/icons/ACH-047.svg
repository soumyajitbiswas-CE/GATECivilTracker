  <circle cx="512" cy="492" r="111" fill="#0A351B" stroke="#BFFF9F" stroke-width="6"/>
  <circle cx="512" cy="492" r="78" fill="#071B0E" stroke="#55FF78" stroke-width="6"/>
</g>

<!-- radial vault lock -->
<g filter="url(#tight)" stroke-linecap="round">
  <path d="M512 382V418M512 566V602M402 492H438M586 492H622"
        stroke="#CFFFAD" stroke-width="9"/>
  <path d="M434 414L460 440M564 544L590 570M590 414L564 440M460 544L434 570"
        stroke="#70FF7F" stroke-width="8"/>
</g>

<!-- stored knowledge core -->
<g filter="url(#glow)">
  <path d="M512 428L536 468L580 492L536 516L512 556L488 516L444 492L488 468Z"
        fill="url(#green)" stroke="#E8FFD2" stroke-width="7"/>
  <circle cx="512" cy="492" r="13" fill="#06150B"/>
</g>

<!-- vault bars -->
<g fill="none" stroke-linecap="round">
  <path d="M390 356H450M574 356H634" stroke="#AFFF92" stroke-width="7"/>
  <path d="M390 628H450M574 628H634" stroke="#55FF78" stroke-width="7"/>
</g>

<!-- stored-data nodes -->
<g filter="url(#tight)">
  <circle cx="390" cy="356" r="12" fill="#DFFFBE" stroke="#72FF80" stroke-width="5"/>
  <circle cx="634" cy="356" r="12" fill="#BFFF9F" stroke="#55FF78" stroke-width="5"/>
  <circle cx="390" cy="628" r="12" fill="#70FF7F" stroke="#45EF6D" stroke-width="5"/>
  <circle cx="634" cy="628" r="12" fill="#55FF78" stroke="#45EF6D" stroke-width="5"/>
</g>

<!-- lock spokes -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M512 228V278" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 228V278" stroke="#CFFFAD" stroke-width="8"/>
  <path d="M512 706V756" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 706V756" stroke="#63FF79" stroke-width="8"/>
</g>

<!-- secure orbit -->
<g fill="none" stroke-linecap="round">
  <circle cx="512" cy="492" r="168" stroke="#55FF78" stroke-width="5" stroke-dasharray="8 18"/>
  <circle cx="512" cy="492" r="202" stroke="#2AD75A" stroke-width="4" stroke-dasharray="20 15"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>