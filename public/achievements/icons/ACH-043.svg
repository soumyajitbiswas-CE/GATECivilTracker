  <rect x="356" y="482" width="312" height="52" rx="12" fill="#0A321A" stroke="#43EF6D" stroke-width="5"/>
  <rect x="356" y="554" width="312" height="52" rx="12" fill="#0A321A" stroke="#43EF6D" stroke-width="5"/>
</g>

