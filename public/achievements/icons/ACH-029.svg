<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="300" y1="170" x2="720" y2="790" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".8"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- checkpoint chamber -->
<g filter="url(#shadow)">
  <path d="M512 264L698 371V597L512 704L326 597V371Z" fill="#06150B" stroke="#42F26D" stroke-width="10"/>
  <path d="M512 302L660 387V581L512 666L364 581V387Z" fill="#0A2A16" stroke="#159A47" stroke-width="4"/>
</g>

<!-- milestone track -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M370 568L430 510L486 550L548 448L600 484L654 376"
        stroke="#0A6B34" stroke-width="30"/>
  <path d="M370 568L430 510L486 550L548 448L600 484L654 376"
        stroke="#8DFF7E" stroke-width="8"/>
</g>

<!-- checkpoint gates -->
<g filter="url(#shadow)">
  <path d="M344 568L370 544L396 568L370 592Z" fill="#0A351B" stroke="#70FF7F" stroke-width="7"/>
  <path d="M408 508L430 486L452 508L430 530Z" fill="#0A351B" stroke="#AFFF92" stroke-width="7"/>
  <path d="M466 550L486 530L506 550L486 570Z" fill="#0A351B" stroke="#CFFFAD" stroke-width="7"/>
  <path d="M526 448L548 426L570 448L548 470Z" fill="#0A351B" stroke="#CFFFAD" stroke-width="7"/>
  <path d="M578 484L600 462L622 484L600 506Z" fill="#0A351B" stroke="#AFFF92" stroke-width="7"/>
</g>

<!-- final checkpoint beacon -->
<g filter="url(#shadow)">
  <circle cx="654" cy="376" r="62" fill="#06150B" stroke="#DFFFBE" stroke-width="9"/>
  <circle cx="654" cy="376" r="38" fill="url(#green)" stroke="#F0FFD9" stroke-width="6"/>
  <path d="M654 350V402M628 376H680" stroke="#06150B" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- progress core -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="76" fill="#06150B" stroke="#70FF80" stroke-width="9"/>
  <circle cx="512" cy="492" r="48" fill="url(#green)" stroke="#E8FFD2" stroke-width="6"/>
  <circle cx="512" cy="492" r="10" fill="#06150B"/>
</g>

<!-- checkpoint pulse -->
<g fill="none" stroke-linecap="round" filter="url(#tight)">
  <circle cx="512" cy="492" r="112" stroke="#BFFF9F" stroke-width="6" stroke-dasharray="8 15"/>
  <circle cx="512" cy="492" r="150" stroke="#55FF78" stroke-width="4" stroke-dasharray="18 14"/>
</g>

<!-- progress beams -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M512 214V278" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 214V278" stroke="#E3FFC8" stroke-width="8"/>
  <path d="M512 706V770" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 706V770" stroke="#63FF79" stroke-width="8"/>
</g>

<!-- milestone nodes -->
<g filter="url(#tight)">
  <circle cx="370" cy="568" r="11" fill="#DFFFBE"/>
  <circle cx="430" cy="510" r="11" fill="#BFFF9F"/>
  <circle cx="486" cy="550" r="11" fill="#AFFF92"/>
  <circle cx="548" cy="448" r="11" fill="#CFFFAD"/>
  <circle cx="600" cy="484" r="11" fill="#8DFF80"/>
</g>

<!-- checkpoint side markers -->
<g filter="url(#tight)">
  <path d="M356 356L370 380L356 404L342 380Z" fill="#DFFFBE"/>
  <path d="M668 356L682 380L668 404L654 380Z" fill="#AFFF92"/>
  <path d="M356 606L370 630L356 654L342 630Z" fill="#70FF7F"/>
  <path d="M668 606L682 630L668 654L654 630Z" fill="#55FF78"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>