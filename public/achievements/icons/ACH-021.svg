<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="320" y1="180" x2="700" y2="790" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".8"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- outer aura -->
<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- stacked time modules -->
<g filter="url(#shadow)">
  <path d="M332 568L512 666L692 568L692 622L512 722L332 622Z"
        fill="#071A0E" stroke="#27D85B" stroke-width="7"/>
  <path d="M332 502L512 600L692 502L692 556L512 656L332 556Z"
        fill="#0A2815" stroke="#35E967" stroke-width="8"/>
  <path d="M332 436L512 534L692 436L692 490L512 590L332 490Z"
        fill="#0C321A" stroke="#55FF78" stroke-width="9"/>
  <path d="M332 370L512 468L692 370L692 424L512 524L332 424Z"
        fill="#103D20" stroke="#8BFF7E" stroke-width="10"/>
</g>

<!-- luminous stacked cores -->
<g filter="url(#glow)">
  <path d="M382 374L512 304L642 374L512 444Z"
        fill="#0A351B" stroke="#BFFF9F" stroke-width="7"/>
  <path d="M414 374L512 322L610 374L512 426Z"
        fill="url(#green)" stroke="#E3FFC8" stroke-width="5"/>
</g>

<!-- time units / stored energy -->
<g filter="url(#tight)">
  <circle cx="512" cy="492" r="24" fill="#06150B" stroke="#CFFFAD" stroke-width="6"/>
  <circle cx="512" cy="492" r="9" fill="#F0FFD9"/>
  <circle cx="512" cy="558" r="20" fill="#06150B" stroke="#9CFF89" stroke-width="5"/>
  <circle cx="512" cy="624" r="17" fill="#06150B" stroke="#70FF7F" stroke-width="5"/>
  <circle cx="512" cy="690" r="14" fill="#06150B" stroke="#45EF6D" stroke-width="5"/>
</g>

<!-- vertical accumulation beam -->
<g filter="url(#glow)">
  <path d="M512 274V690" stroke="#0A6B34" stroke-width="26" stroke-linecap="round" opacity=".9"/>
  <path d="M512 274V690" stroke="#8DFF7E" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- upward accumulation arrow -->
<g filter="url(#tight)">
  <path d="M512 246L474 296H497V344H527V296H550Z"
        fill="url(#green)" stroke="#DFFFBE" stroke-width="5" stroke-linejoin="round"/>
</g>

<!-- side calibration marks -->
<g stroke="#73FF88" stroke-linecap="round">
  <path d="M314 374H352M314 440H352M314 506H352M314 572H352M314 638H352"
        stroke-width="6"/>
  <path d="M672 374H710M672 440H710M672 506H710M672 572H710M672 638H710"
        stroke-width="6"/>
</g>

<!-- accumulated-energy particles -->
<g filter="url(#tight)">
  <circle cx="380" cy="318" r="7" fill="#DFFFBE"/>
  <circle cx="644" cy="318" r="7" fill="#AFFF92"/>
  <circle cx="350" cy="610" r="6" fill="#70FF7F"/>
  <circle cx="674" cy="610" r="6" fill="#4CF36F"/>
  <circle cx="420" cy="744" r="5" fill="#8DFF80"/>
  <circle cx="604" cy="744" r="5" fill="#63FF79"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corners -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- subtle particles -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>