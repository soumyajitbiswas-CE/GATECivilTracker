<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="300" y1="180" x2="720" y2="790" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".8"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- massive threshold gate -->
<g filter="url(#shadow)">
  <path d="M350 654V382L512 288L674 382V654" fill="#06150B" stroke="#42F26D" stroke-width="11"/>
  <path d="M386 632V402L512 330L638 402V632" fill="#0A2A16" stroke="#159A47" stroke-width="5"/>
</g>

<!-- split gate / threshold fracture -->
<g filter="url(#glow)">
  <path d="M512 316L548 392L526 438L560 488L524 532L544 600L512 658"
        stroke="#DFFFBE" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512 316L476 392L498 438L464 488L500 532L480 600L512 658"
        stroke="#59FF78" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- doors forced apart -->
<g filter="url(#tight)">
  <path d="M402 408L492 458L476 522L402 574Z" fill="#0C3C1E" stroke="#9CFF89" stroke-width="7"/>
  <path d="M622 408L532 458L548 522L622 574Z" fill="#0C3C1E" stroke="#9CFF89" stroke-width="7"/>
  <path d="M402 408L440 430" stroke="#D1FFB0" stroke-width="6"/>
  <path d="M622 408L584 430" stroke="#D1FFB0" stroke-width="6"/>
</g>

<!-- beyond-threshold core -->
<g filter="url(#shadow)">
  <circle cx="512" cy="490" r="94" fill="#06150B" stroke="#6EFF7F" stroke-width="9"/>
  <circle cx="512" cy="490" r="61" fill="#0A351B" stroke="#CFFFAD" stroke-width="5"/>
  <path d="M512 426L534 468L576 490L534 512L512 554L490 512L448 490L490 468Z"
        fill="url(#green)" stroke="#E2FFC8" stroke-width="5"/>
  <circle cx="512" cy="490" r="13" fill="#F0FFD9"/>
</g>

<!-- breakthrough path -->
<g filter="url(#glow)">
  <path d="M512 700V610" stroke="#0A6B34" stroke-width="32" stroke-linecap="round"/>
  <path d="M512 700V610" stroke="#76FF83" stroke-width="9" stroke-linecap="round"/>
  <path d="M512 374V282" stroke="#0A6B34" stroke-width="32" stroke-linecap="round"/>
  <path d="M512 374V282" stroke="#BFFF9F" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- threshold fragments -->
<g filter="url(#tight)">
  <path d="M352 332L388 350L368 382L330 360Z" fill="#72FF80" stroke="#C9FFAA" stroke-width="4"/>
  <path d="M672 332L636 350L656 382L694 360Z" fill="#5BFF78" stroke="#B5FF99" stroke-width="4"/>
  <path d="M330 598L370 576L384 612L346 636Z" fill="#4CF36F" stroke="#9EFF89" stroke-width="4"/>
  <path d="M694 598L654 576L640 612L678 636Z" fill="#4CF36F" stroke="#9EFF89" stroke-width="4"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>