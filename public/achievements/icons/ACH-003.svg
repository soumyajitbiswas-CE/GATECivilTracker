<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".52" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="350" y1="250" x2="680" y2="740" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D8FFAE"/><stop offset=".24" stop-color="#7CFF4D"/><stop offset=".62" stop-color="#22D85A"/><stop offset="1" stop-color="#067A35"/>
  </linearGradient>
  <linearGradient id="dial" x1="330" y1="300" x2="690" y2="690" gradientUnits="userSpaceOnUse">
    <stop stop-color="#B8FF9A"/><stop offset=".4" stop-color="#35EE68"/><stop offset="1" stop-color="#087A38"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="15"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".78"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- restrained outer technical aura -->
<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>

<!-- technical field -->
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>
<g stroke="#67FF83" stroke-opacity=".13" stroke-width="2">
  <path d="M512 210V774"/><path d="M230 492H794"/>
  <path d="M312 292L712 692"/><path d="M712 292L312 692"/>
</g>

<!-- calendar body -->
<g filter="url(#shadow)">
  <rect x="276" y="300" width="472" height="410" rx="34" fill="#06150B" stroke="#36EF68" stroke-width="9"/>
  <!-- top calendar rail -->
  <path d="M276 392H748" stroke="#69FF7C" stroke-width="7"/>
  <path d="M338 276V338M686 276V338" stroke="#9EFF89" stroke-width="14" stroke-linecap="round"/>
  <path d="M326 352H698" stroke="#0E7D3A" stroke-width="8"/>
</g>

<!-- three active day cells -->
<g filter="url(#tight)">
  <rect x="330" y="438" width="100" height="92" rx="18" fill="#0A321A" stroke="#4CFF72" stroke-width="6"/>
  <rect x="462" y="438" width="100" height="92" rx="18" fill="#0A321A" stroke="#76FF82" stroke-width="7"/>
  <rect x="594" y="438" width="100" height="92" rx="18" fill="#0A321A" stroke="#4CFF72" stroke-width="6"/>
  <circle cx="380" cy="484" r="20" fill="url(#green)"/>
  <circle cx="512" cy="484" r="25" fill="url(#green)"/>
  <circle cx="644" cy="484" r="20" fill="url(#green)"/>
</g>

<!-- continuation path: three linked study days -->
<g filter="url(#tight)">
  <path d="M380 584C425 550 468 550 512 584C556 618 599 618 644 584"
        stroke="#5BFF78" stroke-width="10" stroke-linecap="round"/>
  <circle cx="380" cy="584" r="11" fill="#D7FFB7"/>
  <circle cx="512" cy="584" r="15" fill="#D7FFB7"/>
  <circle cx="644" cy="584" r="11" fill="#D7FFB7"/>
</g>

<!-- subtle daily-driver arrow / forward momentum -->
<g filter="url(#tight)">
  <path d="M402 655H622" stroke="#1DBA50" stroke-width="15" stroke-linecap="round"/>
  <path d="M574 620L624 655L574 690" stroke="#72FF80" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- four technical corner markers -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<!-- orbit nodes -->
<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="245" cy="492" r="5"/><circle cx="779" cy="492" r="5"/>
  <circle cx="512" cy="220" r="5"/><circle cx="512" cy="764" r="5"/>
</g>
</svg>