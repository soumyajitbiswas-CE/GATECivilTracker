  <ellipse cx="512" cy="500" rx="220" ry="74" stroke="#2AD75A" stroke-width="4" stroke-dasharray="20 15"/>
</g>

<!-- acceleration streaks -->
<g filter="url(#glow)" stroke-linecap="round">
