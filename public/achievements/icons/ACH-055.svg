  <path d="M512 300V220" stroke="#0A6B34" stroke-width="34"/>
  <path d="M512 300V220" stroke="#E3FFC8" stroke-width="9"/>
  <path d="M512 220L478 258M512 220L546 258" stroke="#E3FFC8" stroke-width="9"/>
</g>

<!-- launch shockwave -->
