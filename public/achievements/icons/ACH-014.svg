<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="300" y1="170" x2="720" y2="790" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".8"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- momentum chamber -->
<g filter="url(#shadow)">
  <path d="M512 264L698 371V597L512 704L326 597V371Z"
        fill="#06150B" stroke="#42F26D" stroke-width="10"/>
  <path d="M512 302L660 387V581L512 666L364 581V387Z"
        fill="#0A2A16" stroke="#159A47" stroke-width="4"/>
</g>

<!-- accelerating orbital track -->
<g fill="none" stroke-linecap="round" filter="url(#glow)">
  <path d="M352 520C370 408 452 338 554 346C646 354 694 428 674 506C654 584 574 630 494 614C414 598 370 542 386 470"
        stroke="#0A6B34" stroke-width="30"/>
  <path d="M352 520C370 408 452 338 554 346C646 354 694 428 674 506C654 584 574 630 494 614C414 598 370 542 386 470"
        stroke="#8DFF7E" stroke-width="8"/>
</g>

<!-- momentum arrowhead -->
<g filter="url(#shadow)">
  <path d="M650 330L700 366L648 390L656 360Z"
        fill="url(#green)" stroke="#E3FFC8" stroke-width="6" stroke-linejoin="round"/>
</g>

<!-- central momentum turbine -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="112" fill="#06150B" stroke="#70FF80" stroke-width="9"/>
  <circle cx="512" cy="492" r="78" fill="#0A351B" stroke="#CFFFAD" stroke-width="5"/>
  <path d="M512 414L538 462L590 492L538 522L512 570L486 522L434 492L486 462Z"
        fill="url(#green)" stroke="#E2FFC8" stroke-width="6"/>
  <circle cx="512" cy="492" r="13" fill="#F0FFD9"/>
</g>

<!-- rotating turbine blades -->
<g fill="none" stroke="#BFFF9F" stroke-width="10" stroke-linecap="round" filter="url(#tight)">
  <path d="M512 414C552 424 580 450 590 492"/>
  <path d="M590 492C580 532 552 560 512 570"/>
  <path d="M512 570C472 560 444 532 434 492"/>
  <path d="M434 492C444 450 472 424 512 414"/>
</g>

<!-- momentum vectors -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M338 448L296 428M348 482L292 476M674 430L724 408M684 466L738 458"
        stroke="#63FF79" stroke-width="7"/>
  <path d="M390 636L356 666M634 636L668 666"
        stroke="#55FF78" stroke-width="7"/>
</g>

<!-- accumulated motion nodes -->
<g filter="url(#tight)">
  <circle cx="384" cy="408" r="12" fill="#DFFFBE"/>
  <circle cx="640" cy="390" r="12" fill="#BFFF9F"/>
  <circle cx="664" cy="574" r="12" fill="#70FF7F"/>
  <circle cx="390" cy="594" r="12" fill="#55FF78"/>
</g>

<!-- momentum rails -->
<g filter="url(#glow)" stroke-linecap="round">
  <path d="M512 216V270" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 216V270" stroke="#CFFFAD" stroke-width="8"/>
  <path d="M512 714V768" stroke="#0A6B34" stroke-width="30"/>
  <path d="M512 714V768" stroke="#63FF79" stroke-width="8"/>
</g>

<!-- speed rings -->
<g fill="none" stroke-linecap="round">
  <circle cx="512" cy="492" r="142" stroke="#55FF78" stroke-width="5" stroke-dasharray="6 18"/>
  <circle cx="512" cy="492" r="178" stroke="#2AD75A" stroke-width="4" stroke-dasharray="20 15"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>