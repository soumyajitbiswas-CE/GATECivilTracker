<circle cx="512" cy="462" r="104" stroke="#CFFFAD" stroke-width="6" stroke-dasharray="8 14"/>
<circle cx="512" cy="462" r="152" stroke="#70FF7F" stroke-width="5" stroke-dasharray="20 13"/>
<circle cx="512" cy="462" r="208" stroke="#2AD75A" stroke-width="4" stroke-dasharray="6 24"/>
</g>

<!-- resistance shattered behind the force -->
<g filter="url(#shadow)" stroke-linejoin="round">
<path d="M360 392L414 366L438 410L398 444L350 430Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M664 392L610 366L586 410L626 444L674 430Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M350 554L398 540L438 574L414 618L360 592Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
<path d="M674 554L626 540L586 574L610 618L664 592Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
</g>

<!-- pressure waves -->
<g filter="url(#glow)" stroke-linecap="round">
<path d="M344 462H400M680 462H624" stroke="#E3FFC8" stroke-width="9"/>
<path d="M370 350L414 382M654 350L610 382" stroke="#CFFFAD" stroke-width="8"/>
<path d="M370 626L414 594M654 626L610 594" stroke="#70FF7F" stroke-width="8"/>
</g>

<!-- side drive nodes -->
