<!-- forward drive -->
<g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
<path d="M512 650V246" stroke="#0A6B34" stroke-width="34"/>
<path d="M512 650V246" stroke="#CFFFAD" stroke-width="9"/>
<path d="M512 246L470 298M512 246L554 298" stroke="#E3FFC8" stroke-width="10"/>
</g>

<!-- unstoppable pressure rings -->
