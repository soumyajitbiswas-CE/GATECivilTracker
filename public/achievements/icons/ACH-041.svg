<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
<radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
<stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
</radialGradient>
<linearGradient id="g" x1="300" y1="170" x2="720" y2="790" gradientUnits="userSpaceOnUse">
<stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
</linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".8"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/></pattern>
</defs>

<g filter="url(#glow)" opacity=".72">
<circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
<circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>
<g filter="url(#shadow)">
<circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
<circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
<circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- clarity chamber -->
<g filter="url(#shadow)">
<path d="M512 264L698 371V597L512 704L326 597V371Z" fill="#06150B" stroke="#42F26D" stroke-width="10"/>
<path d="M512 302L660 387V581L512 666L364 581V387Z" fill="#0A2A16" stroke="#159A47" stroke-width="4"/>
</g>

<!-- lens housing -->
<g filter="url(#shadow)">
<circle cx="512" cy="492" r="144" fill="#071B0E" stroke="#70FF7F" stroke-width="11"/>
<circle cx="512" cy="492" r="112" fill="#0A351B" stroke="#BFFF9F" stroke-width="6"/>
</g>

<!-- clarity lens -->
<g filter="url(#glow)">
<circle cx="512" cy="492" r="76" fill="#06150B" stroke="#DFFFBE" stroke-width="8"/>
<path d="M512 432L540 462L576 492L540 522L512 552L484 522L448 492L484 462Z"
fill="url(#g)" stroke="#F0FFD9" stroke-width="7"/>
<circle cx="512" cy="492" r="12" fill="#06150B"/>
</g>

<!-- focused beam -->
<g filter="url(#glow)" stroke-linecap="round">
<path d="M320 492H438M586 492H704" stroke="#0A6B34" stroke-width="30"/>
<path d="M320 492H438M586 492H704" stroke="#E3FFC8" stroke-width="8"/>
</g>

<!-- lens crosshair -->
<g stroke="#CFFFAD" stroke-width="7" stroke-linecap="round">
<path d="M512 350V414M512 570V634"/>
<path d="M370 492H434M590 492H654"/>
</g>

<!-- clarity rings -->
<g fill="none" stroke-linecap="round">
<circle cx="512" cy="492" r="92" stroke="#CFFFAD" stroke-width="6" stroke-dasharray="7 15"/>
<circle cx="512" cy="492" r="132" stroke="#70FF7F" stroke-width="5" stroke-dasharray="20 13"/>
<circle cx="512" cy="492" r="184" stroke="#2AD75A" stroke-width="4" stroke-dasharray="6 24"/>
</g>

<!-- focus shutters opening -->
<g filter="url(#shadow)" stroke-linejoin="round">
<path d="M392 414L426 382L470 432L436 462Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M632 414L598 382L554 432L588 462Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M392 570L426 602L470 552L436 522Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
<path d="M632 570L598 602L554 552L588 522Z" fill="#0D3B1D" stroke="#70FF7F" stroke-width="7"/>
</g>

<!-- clear-sight rays -->
<g filter="url(#tight)" stroke-linecap="round">
<path d="M388 348L420 320M636 348L604 320" stroke="#E3FFC8" stroke-width="8"/>
<path d="M388 636L420 664M636 636L604 664" stroke="#70FF7F" stroke-width="8"/>
</g>

<!-- vertical clarity rails -->
<g filter="url(#glow)" stroke-linecap="round">
<path d="M512 210V282" stroke="#0A6B34" stroke-width="32"/>
<path d="M512 210V282" stroke="#E3FFC8" stroke-width="9"/>
<path d="M512 702V780" stroke="#0A6B34" stroke-width="32"/>
<path d="M512 702V780" stroke="#63FF79" stroke-width="9"/>
</g>

<!-- clarity particles -->
<g filter="url(#tight)">
<circle cx="414" cy="316" r="5" fill="#E3FFC8"/>
<circle cx="610" cy="316" r="5" fill="#CFFFAD"/>
<circle cx="392" cy="662" r="4" fill="#70FF7F"/>
<circle cx="632" cy="662" r="4" fill="#55FF78"/>
</g>

<g filter="url(#tight)">
<path d="M512 132L541 170L512 206L483 170Z" fill="url(#g)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
<path d="M270 270H340M270 270V340"/>
<path d="M754 270H684M754 270V340"/>
<path d="M270 714H340M270 714V644"/>
<path d="M754 714H684M754 714V644"/>
</g>
</svg>