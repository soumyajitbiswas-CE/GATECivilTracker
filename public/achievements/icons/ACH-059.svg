<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<defs>
  <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 492) rotate(90) scale(405)">
    <stop stop-color="#173F25"/><stop offset=".5" stop-color="#092113"/><stop offset="1" stop-color="#020805"/>
  </radialGradient>
  <linearGradient id="green" x1="320" y1="190" x2="700" y2="780" gradientUnits="userSpaceOnUse">
    <stop stop-color="#E1FFB8"/><stop offset=".22" stop-color="#86FF55"/><stop offset=".6" stop-color="#20D85A"/><stop offset="1" stop-color="#057436"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".8"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#39E76B" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="4" cy="4" r="1.5" fill="#A5FF87" fill-opacity=".15"/>
  </pattern>
</defs>

<!-- outer technical aura -->
<g filter="url(#glow)" opacity=".72">
  <circle cx="512" cy="492" r="350" stroke="#4CFF78" stroke-width="8" stroke-dasharray="3 25" opacity=".42"/>
  <circle cx="512" cy="492" r="326" stroke="#1CBE50" stroke-width="3" stroke-dasharray="14 18" opacity=".5"/>
</g>

<!-- dark medallion -->
<g filter="url(#shadow)">
  <circle cx="512" cy="492" r="338" fill="url(#bg)" stroke="#0B4A27" stroke-width="8"/>
  <circle cx="512" cy="492" r="319" stroke="#42FF72" stroke-opacity=".58" stroke-width="3"/>
  <circle cx="512" cy="492" r="294" stroke="#0A7A3B" stroke-opacity=".6" stroke-width="2"/>
</g>
<circle cx="512" cy="492" r="286" fill="url(#grid)"/>

<!-- immaculate study board -->
<g filter="url(#shadow)">
  <path d="M300 310H724L750 336V650L724 676H300L274 650V336Z"
        fill="#06150B" stroke="#42F26D" stroke-width="9"/>
  <path d="M318 350H706" stroke="#8DFF7E" stroke-width="6"/>
  <path d="M318 620H706" stroke="#168C43" stroke-width="5"/>
</g>

<!-- four completed clean modules -->
<g filter="url(#tight)">
  <rect x="330" y="392" width="145" height="178" rx="20" fill="#0A321A" stroke="#62FF79" stroke-width="6"/>
  <rect x="549" y="392" width="145" height="178" rx="20" fill="#0A321A" stroke="#62FF79" stroke-width="6"/>

  <!-- left module: cleared stack -->
  <path d="M365 520H440" stroke="#BFFF9F" stroke-width="8" stroke-linecap="round"/>
  <path d="M365 490H440" stroke="#7EFF80" stroke-width="8" stroke-linecap="round"/>
  <path d="M365 460H440" stroke="#42EF6D" stroke-width="8" stroke-linecap="round"/>
  <path d="M365 430H440" stroke="#24D85A" stroke-width="8" stroke-linecap="round"/>
  <path d="M378 535L390 547L414 518" stroke="#D9FFB7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right module: clean target -->
  <circle cx="621" cy="480" r="58" fill="#06150B" stroke="#B8FF99" stroke-width="6"/>
  <circle cx="621" cy="480" r="38" stroke="#4CFF72" stroke-width="6"/>
  <circle cx="621" cy="480" r="16" fill="#DFFFBE"/>
  <path d="M621 408V425M621 535V552M549 480H566M676 480H693"
        stroke="#62FF79" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- sweeping clean-energy arc -->
<g filter="url(#glow)">
  <path d="M344 610C392 655 444 675 512 675C580 675 632 655 680 610"
        stroke="#0B6B34" stroke-width="30" stroke-linecap="round"/>
  <path d="M344 610C392 655 444 675 512 675C580 675 632 655 680 610"
        stroke="#65FF7A" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- central purified core -->
<g filter="url(#tight)">
  <circle cx="512" cy="515" r="82" fill="#06150B" stroke="#78FF83" stroke-width="8"/>
  <circle cx="512" cy="515" r="54" fill="#0A3B1D" stroke="#C8FFAA" stroke-width="5"/>
  <path d="M512 471L530 500L562 508L538 530L542 562L512 546L482 562L486 530L462 508L494 500Z"
        fill="url(#green)" stroke="#E2FFC8" stroke-width="4"/>
</g>

<!-- four outward clean-up beams -->
<g filter="url(#tight)" stroke="#82FF89" stroke-width="7" stroke-linecap="round">
  <path d="M442 515H405"/>
  <path d="M582 515H619"/>
  <path d="M512 445V408"/>
  <path d="M512 585V622"/>
</g>

<!-- top crystal -->
<g filter="url(#tight)">
  <path d="M512 132L541 170L512 206L483 170Z" fill="url(#green)" stroke="#C5FFA5" stroke-width="5"/>
</g>

<!-- technical corner markers -->
<g stroke="#71FF87" stroke-width="5" stroke-linecap="round" opacity=".72">
  <path d="M270 270H340M270 270V340"/>
  <path d="M754 270H684M754 270V340"/>
  <path d="M270 714H340M270 714V644"/>
  <path d="M754 714H684M754 714V644"/>
</g>

<g fill="#A2FF88" filter="url(#tight)">
  <circle cx="302" cy="414" r="4"/><circle cx="722" cy="414" r="4"/>
  <circle cx="324" cy="610" r="3"/><circle cx="700" cy="610" r="4"/>
  <circle cx="410" cy="756" r="4"/><circle cx="618" cy="756" r="3"/>
</g>
</svg>