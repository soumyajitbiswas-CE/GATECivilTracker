<circle cx="512" cy="470" r="154" stroke="#70FF7F" stroke-width="5" stroke-dasharray="20 13"/>
<circle cx="512" cy="470" r="210" stroke="#2AD75A" stroke-width="4" stroke-dasharray="6 24"/>
</g>

<!-- single direction axis -->
