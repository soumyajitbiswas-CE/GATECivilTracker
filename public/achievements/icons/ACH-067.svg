<path d="M512 210V330" stroke="#0A6B34" stroke-width="34"/>
<path d="M512 210V330" stroke="#E3FFC8" stroke-width="9"/>
<path d="M512 626V780" stroke="#0A6B34" stroke-width="34"/>
<path d="M512 626V780" stroke="#63FF79" stroke-width="9"/>
</g>

