</g>

<!-- focus anchors -->
<g filter="url(#shadow)">
<path d="M366 350L402 330L432 360L408 396L374 384Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
<path d="M658 350L622 330L592 360L616 396L650 384Z" fill="#0D3B1D" stroke="#AFFF92" stroke-width="7"/>
