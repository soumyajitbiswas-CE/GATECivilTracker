<circle cx="610" cy="314" r="5" fill="#CFFFAD"/>
<circle cx="392" cy="664" r="4" fill="#70FF7F"/>
<circle cx="632" cy="664" r="4" fill="#55FF78"/>
<path d="M512 286L528 302L512 318L496 302Z" fill="#F0FFD9"/>
</g>

